<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tennis Tracker · IBERO León</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    /* =============================================
       DESIGN TOKENS — Premium Light Mode
    ============================================= */
    :root {
      /* Backgrounds */
      --bg-primary:   #F7F8FC;
      --bg-secondary: #FFFFFF;
      --surface:      #FFFFFF;
      --surface2:     #F0F2F8;
      --surface3:     #E8EBF4;

      /* IBERO Brand */
      --ibero-red:        #BE0A29;
      --ibero-red-dark:   #8C0720;
      --ibero-red-light:  #D42040;
      --ibero-red-subtle: rgba(190,10,41,0.08);
      --ibero-red-mid:    rgba(190,10,41,0.15);

      /* Text */
      --text:        #1A1D2E;
      --text-muted:  #6B7280;
      --text-light:  #9CA3AF;

      /* Accents Light Mode */
      --accent-a:    #BE0A29;
      --accent-b:    #2563EB;
      --accent-c:    #F59E0B;
      --accent-grad: linear-gradient(135deg, #BE0A29, #D42040);

      /* Medals */
      --gold:   #F59E0B;
      --silver: #9CA3AF;
      --bronze: #CD7F32;

      /* Borders */
      --border:        rgba(0,0,0,0.08);
      --border-accent: rgba(190,10,41,0.20);

      /* Radii */
      --radius:    24px;
      --radius-sm: 16px;
      --radius-xs: 12px;

      /* Shadows — suaves, tipo app de paga */
      --shadow-card: 0 2px 16px rgba(0,0,0,0.07), 0 1px 4px rgba(0,0,0,0.04);
      --shadow-red:  0 4px 20px rgba(190,10,41,0.18);
      --shadow-btn:  0 4px 14px rgba(190,10,41,0.30);
      --shadow-lg:   0 8px 32px rgba(0,0,0,0.10);

      --t: 0.18s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    /* =============================================
       BODY — Clean light background
    ============================================= */
    body {
      background: var(--bg-primary);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding-bottom: 96px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Ensure all main content renders correctly */
    header, .hero-section, .section, #ranking-section,
    .app-footer, #player-select-modal { position: relative; z-index: 1; }

    /* =============================================
       HEADER — Compact sticky light bar
    ============================================= */
    header {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      min-height: 66px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-logo {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--ibero-red-dark), var(--ibero-red));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(190,10,41,0.40);
    }

    .header-title-main {
      display: block;
      font-size: 1.02rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      color: var(--text);
      text-transform: uppercase;
    }

    .header-title-sub {
      display: block;
      font-size: 0.60rem;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 2px;
    }

    .btn-header {
      background: var(--ibero-red-subtle);
      color: var(--ibero-red);
      border: 1.5px solid var(--border-accent);
      padding: 9px 15px;
      font-size: 0.76rem;
      letter-spacing: 0.04em;
      border-radius: var(--radius-xs);
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      transition: background var(--t), border-color var(--t), box-shadow var(--t);
      touch-action: manipulation;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-header:hover {
      background: var(--ibero-red-mid);
      border-color: var(--ibero-red);
      box-shadow: var(--shadow-red);
    }

    .btn-header:active { transform: scale(0.95); }

    /* =============================================
       HERO — Premium light card with IBERO red
    ============================================= */
    .hero-section {
      background: linear-gradient(135deg, #BE0A29 0%, #8C0720 100%);
      border-radius: 0 0 32px 32px;
      padding: 36px 24px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Sports image overlay */
    .hero-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        url("https://elements-resized.envatousercontent.com/elements-cover-images/2db22101-7a8d-4fce-91d0-b96c303ccaae?w=2038&cf_fit=scale-down&q=85&format=auto&s=de8a2fc851d5ca701edae22791e52c20cd0350f4029e2dbded59c2fc67b212e3");
      background-size: cover;
      background-position: center top;
      opacity: 0.12;
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    /* Remove dark vignette — not needed on red hero */
    .hero-section::after {
      display: none;
    }

    /* Diagonal stripes — hidden in light mode */
    .hero-stripes {
      display: none;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-badge {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.30);
      color: #FFFFFF;
      font-size: 0.60rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 16px;
      backdrop-filter: blur(4px);
    }

    .hero-quote {
      font-family: 'Bebas Neue', 'Inter', sans-serif;
      font-size: clamp(3.6rem, 14vw, 5.8rem);
      font-weight: 400;
      letter-spacing: 0.06em;
      line-height: 0.92;
      color: #FFFFFF;
      text-shadow: none;
      margin-bottom: 14px;
    }

    .hero-quote span {
      color: rgba(255,255,255,0.85);
      background: none;
      -webkit-background-clip: initial;
      -webkit-text-fill-color: initial;
      background-clip: initial;
    }

    .hero-sub {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.08em;
      font-weight: 500;
      text-transform: uppercase;
    }

    /* =============================================
       GENERIC BUTTON BASE
    ============================================= */
    button {
      cursor: pointer;
      border: none;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-weight: 700;
      transition: background var(--t), box-shadow var(--t),
                  border-color var(--t), color var(--t), transform 0.10s;
      touch-action: manipulation;
      letter-spacing: 0.02em;
    }

    button:active { transform: scale(0.95); }

    /* Primary — IBERO Red */
    .btn-primary {
      background: linear-gradient(135deg, var(--ibero-red) 0%, var(--ibero-red-dark) 100%);
      color: #FFFFFF;
      padding: 14px 22px;
      font-size: 0.90rem;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-btn);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid rgba(255,255,255,0.10);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--ibero-red-light) 0%, var(--ibero-red) 100%);
      box-shadow: 0 6px 28px rgba(190,10,41,0.55);
    }

    /* Ghost / outline */
    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1.5px solid var(--border);
      padding: 12px 18px;
      font-size: 0.85rem;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: rgba(0,0,0,0.20);
      background: rgba(0,0,0,0.03);
    }

    /* Icon-only */
    .btn-icon {
      background: transparent;
      color: var(--text-light);
      padding: 7px 10px;
      font-size: 0.85rem;
      border-radius: var(--radius-xs);
      border: 1px solid transparent;
      line-height: 1;
      flex-shrink: 0;
    }

    .btn-icon:hover {
      color: var(--ibero-red);
      background: var(--ibero-red-subtle);
      border-color: var(--border-accent);
    }

    /* Close-set — IBERO red light mode */
    .btn-close-set {
      background: var(--ibero-red-subtle);
      color: var(--ibero-red);
      border: 1.5px solid var(--border-accent);
      padding: 13px 18px;
      font-size: 0.85rem;
      width: 100%;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-close-set:hover {
      background: var(--ibero-red-mid);
      border-color: var(--ibero-red);
      box-shadow: var(--shadow-red);
    }

    /* =============================================
       SCORE STEPPER
    ============================================= */
    .score-stepper {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 50px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .btn-stepper {
      background: transparent;
      color: var(--text-muted);
      border: none;
      border-radius: 0;
      width: 40px;
      height: 40px;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background var(--t), color var(--t);
    }

    .btn-stepper.btn-minus:hover {
      background: var(--surface3);
      color: var(--text);
    }

    .btn-stepper.btn-plus {
      color: var(--ibero-red);
    }

    .btn-stepper.btn-plus:hover {
      background: var(--ibero-red-subtle);
      color: var(--ibero-red);
    }

    .btn-stepper:active { transform: scale(0.88); }

    .score-display {
      min-width: 34px;
      text-align: center;
      font-size: 1.10rem;
      font-weight: 900;
      color: var(--text);
      user-select: none;
      padding: 0 2px;
    }

    .score-stepper.disabled {
      opacity: 0.60;
      pointer-events: none;
      background: transparent;
      border-color: var(--border);
    }

    .score-stepper.disabled .score-display {
      color: var(--ibero-red);
    }

    /* =============================================
       PROGRESS RING WIDGET
    ============================================= */
    .score-ring-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ring-container {
      position: relative;
      width: 56px;
      height: 56px;
      flex-shrink: 0;
    }

    .progress-ring {
      transform: rotate(-90deg);
      overflow: visible;
    }

    .ring-track {
      fill: none;
      stroke: rgba(0,0,0,0.08);
      stroke-width: 4;
    }

    .ring-fill {
      fill: none;
      stroke: url(#scoreGradient);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 138.23;
      stroke-dashoffset: 138.23;
      transition: stroke-dashoffset 0.40s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .ring-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.80rem;
      font-weight: 900;
      color: var(--text);
      pointer-events: none;
    }

    /* =============================================
       SECTIONS
    ============================================= */
    .section {
      padding: 28px 16px 0;
      max-width: 680px;
      margin: 0 auto;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .section-icon {
      width: 36px;
      height: 36px;
      background: var(--ibero-red-subtle);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-xs);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      color: var(--ibero-red);
    }

    .section-title {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 800;
      flex: 1;
    }

    /* =============================================
       PLAYERS SECTION
    ============================================= */
    #players-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 15px;
      animation: fadeSlideIn 0.22s ease;
      box-shadow: var(--shadow-card);
      transition: border-color var(--t), box-shadow var(--t);
    }

    .player-row:hover {
      border-color: var(--border-accent);
      box-shadow: var(--shadow-red);
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .player-avatar {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--ibero-red-dark), var(--ibero-red));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.68rem;
      font-weight: 900;
      color: #FFFFFF;
      box-shadow: 0 2px 10px rgba(190,10,41,0.35);
    }

    .player-name-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      padding: 3px 0;
      border-bottom: 2px solid transparent;
      transition: border-color var(--t);
    }

    .player-name-input::placeholder { color: var(--text-light); }

    .player-name-input:focus {
      border-bottom-color: var(--ibero-red);
    }

    /* Add player row */
    .add-player-row {
      display: flex;
      gap: 10px;
    }

    .add-player-input {
      flex: 1;
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      padding: 13px 16px;
      outline: none;
      box-shadow: var(--shadow-card);
      transition: border-color var(--t), box-shadow var(--t);
    }

    .add-player-input::placeholder { color: var(--text-light); }

    .add-player-input:focus {
      border-color: var(--ibero-red);
      box-shadow: 0 0 0 3px rgba(190,10,41,0.14), var(--shadow-card);
    }

    /* =============================================
       SETS SECTION
    ============================================= */
    #sets-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 16px;
    }

    .set-card {
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      animation: fadeSlideIn 0.28s ease;
      box-shadow: var(--shadow-card);
      transition: box-shadow var(--t), border-color var(--t);
    }

    .set-card:hover {
      border-color: var(--border-accent);
      box-shadow: var(--shadow-red);
    }

    .set-card.closed {
      border-color: rgba(190,10,41,0.20);
      box-shadow: var(--shadow-card);
    }

    .set-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }

    .set-card.closed .set-header {
      background: var(--ibero-red-subtle);
      border-color: var(--border-accent);
    }

    .set-title-wrap {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .set-number-badge {
      width: 32px;
      height: 32px;
      background: var(--accent-grad);
      color: #fff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.74rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      box-shadow: 0 3px 10px rgba(190,10,41,0.25);
    }

    .set-card.closed .set-number-badge {
      background: var(--ibero-red-subtle);
      color: var(--ibero-red);
      box-shadow: none;
    }

    .set-title {
      font-size: 0.76rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--text-muted);
    }

    .set-badge-closed {
      font-size: 0.60rem;
      background: var(--ibero-red-subtle);
      color: var(--ibero-red);
      border: 1px solid var(--border-accent);
      padding: 4px 13px;
      border-radius: 20px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .set-body {
      padding: 4px 20px;
      display: flex;
      flex-direction: column;
    }

    .set-player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .set-player-row:last-child { border-bottom: none; }

    .set-player-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .set-player-avatar {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, var(--ibero-red-dark), var(--ibero-red));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.65rem;
      font-weight: 900;
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(190,10,41,0.30);
    }

    .set-player-name {
      font-size: 0.90rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .set-footer {
      padding: 12px 20px 16px;
      border-top: 1px solid rgba(0,0,0,0.05);
    }

    /* =============================================
       PLAYER SELECT MODAL
    ============================================= */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 300;
      padding: 0;
      animation: overlayIn 0.22s ease;
      touch-action: pan-y;
    }

    .modal-overlay.hidden {
      display: none;
    }

    @keyframes overlayIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .modal-box {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%;
      max-width: 640px;
      max-height: 85vh;
      overflow-y: auto;
      animation: sheetUp 0.30s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: var(--shadow-lg);
    }

    @keyframes sheetUp {
      from { transform: translateY(100%); opacity: 0.5; }
      to   { transform: translateY(0);   opacity: 1; }
    }

    .modal-handle {
      width: 44px;
      height: 4px;
      background: rgba(0,0,0,0.12);
      border-radius: 10px;
      margin: 14px auto 0;
    }

    .modal-header {
      padding: 16px 22px 14px;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      font-size: 1.10rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .modal-header p {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .modal-player-list {
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-player-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 13px 16px;
      transition: border-color var(--t), box-shadow var(--t);
    }

    .modal-player-item:has(.player-select-toggle:checked) {
      border-color: var(--border-accent);
      box-shadow: 0 0 0 3px rgba(190,10,41,0.08);
    }

    .modal-player-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .modal-player-avatar {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--ibero-red-dark), var(--ibero-red));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.70rem;
      font-weight: 900;
      color: #FFF;
      flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(190,10,41,0.35);
    }

    .modal-player-name {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Toggle Switch */
    .toggle {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 26px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: var(--surface3);
      border: 1.5px solid var(--border);
      border-radius: 26px;
      transition: background 0.28s, border-color 0.28s, box-shadow 0.28s;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--text-light);
      border-radius: 50%;
      transition: transform 0.28s, background 0.28s;
    }

    .toggle input:checked + .toggle-slider {
      background: linear-gradient(90deg, #BE0A29, #D42040);
      border-color: transparent;
      box-shadow: 0 0 8px rgba(190,10,41,0.25);
    }

    .toggle input:checked + .toggle-slider::before {
      transform: translateX(20px) translateY(-50%);
      background: #FFFFFF;
    }

    .modal-footer {
      padding: 14px 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .modal-footer .btn-ghost { flex: 1; justify-content: center; }
    .modal-footer .btn-primary { flex: 2; }

    /* Modal select-all bar */
    .modal-select-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 16px 2px;
    }

    .modal-select-bar span {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .modal-select-all {
      background: none;
      border: none;
      color: var(--ibero-red);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 0;
      letter-spacing: 0.04em;
    }

    .modal-select-all:active { transform: scale(0.95); }

    /* =============================================
       RANKING
    ============================================= */
    #ranking-section {
      padding: 28px 16px 0;
      max-width: 680px;
      margin: 0 auto;
    }

    .ranking-card {
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }

    .ranking-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.90rem;
    }

    .ranking-table thead {
      background: var(--accent-grad);
    }

    .ranking-table th {
      padding: 13px 16px;
      text-align: left;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      font-weight: 800;
    }

    .ranking-table th:last-child,
    .ranking-table td:last-child { text-align: right; }

    .ranking-table td {
      padding: 13px 16px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      vertical-align: middle;
      color: var(--text);
    }

    .ranking-table tbody tr:last-child td { border-bottom: none; }

    .ranking-table tbody tr:nth-child(even) {
      background: rgba(0,0,0,0.02);
    }

    .rank-pos {
      font-weight: 800;
      color: var(--text-muted);
      font-size: 0.88rem;
      min-width: 28px;
      display: inline-block;
    }

    .rank-pos.gold   { color: var(--gold); text-shadow: 0 0 12px rgba(245,158,11,0.30); }
    .rank-pos.silver { color: var(--silver); }
    .rank-pos.bronze { color: var(--bronze); }

    .rank-name {
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--text);
    }

    .rank-pts {
      font-weight: 900;
      font-size: 1.05rem;
      background: linear-gradient(135deg, #BE0A29, #D42040);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .rank-sets {
      color: var(--text-muted);
      font-size: 0.80rem;
      font-weight: 500;
    }

    .ranking-table tbody tr {
      transition: background var(--t);
    }

    .ranking-table tbody tr.rank-updated {
      animation: rankPulse 0.55s ease;
    }

    @keyframes rankPulse {
      0%   { background: transparent; }
      40%  { background: rgba(190,10,41,0.06); }
      100% { background: transparent; }
    }

    /* =============================================
       EMPTY STATES
    ============================================= */
    .empty-state {
      text-align: center;
      padding: 44px 20px;
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 2.8rem;
      margin-bottom: 14px;
      opacity: 0.30;
    }

    .empty-state-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .empty-state p {
      font-size: 0.82rem;
      max-width: 260px;
      margin: 0 auto;
      line-height: 1.65;
      color: var(--text-light);
    }

    /* =============================================
       FOOTER
    ============================================= */
    .app-footer {
      text-align: center;
      padding: 24px 16px;
      color: var(--text-light);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .app-footer i {
      color: var(--ibero-red);
      margin: 0 4px;
      font-size: 0.60rem;
    }

    /* =============================================
       UTILITIES
    ============================================= */
    .mt-8  { margin-top: 8px; }
    .mt-16 { margin-top: 16px; }

    /* "Agregar Set" CTA button — accent gradient */
    .btn-add-set {
      width: 100%;
      margin-top: 4px;
      background: linear-gradient(135deg, var(--ibero-red) 0%, var(--ibero-red-dark) 100%);
      color: #FFFFFF;
      padding: 15px 22px;
      font-size: 0.92rem;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-btn);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid rgba(255,255,255,0.10);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .btn-add-set:hover {
      background: linear-gradient(135deg, var(--ibero-red-light) 0%, var(--ibero-red) 100%);
      box-shadow: 0 6px 28px rgba(190,10,41,0.60);
    }

    /* Modal validation shake */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }

    .shake { animation: shake 0.30s ease; }

    /* Score ring wrapper inside a set row */
    .set-score-area {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Global SVG gradient defs for all progress rings -->
  <svg width="0" height="0" style="position:absolute;overflow:hidden;" aria-hidden="true">
    <defs>
      <linearGradient id="scoreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#BE0A29" />
        <stop offset="100%" stop-color="#D42040" />
      </linearGradient>
      <linearGradient id="scoreGradientWarm" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#FF6B00" />
        <stop offset="100%" stop-color="#FFD700" />
      </linearGradient>
    </defs>
  </svg>

  <!-- =================== PLAYER SELECT MODAL =================== -->
  <div id="player-select-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 id="modal-title"><i class="fa-solid fa-users" style="color:var(--ibero-red);margin-right:8px;font-size:0.95rem;"></i>Seleccionar Jugadores</h2>
        <p>Activa los jugadores que participan en este set</p>
      </div>
      <div class="modal-select-bar">
        <span>Jugadores</span>
        <button class="modal-select-all" onclick="toggleAllPlayers(true)">Todos</button>
      </div>
      <div class="modal-player-list" id="modal-player-list"></div>
      <div class="modal-footer">
        <button class="btn-ghost" onclick="closePlayerModal()">
          <i class="fa-solid fa-xmark"></i>Cancelar
        </button>
        <button class="btn-primary" onclick="confirmCreateSet()">
          <i class="fa-solid fa-check"></i>Crear Set
        </button>
      </div>
    </div>
  </div>

  <!-- =================== STICKY HEADER =================== -->
  <header>
    <div class="header-brand">
      <div class="header-logo">🎾</div>
      <div>
        <span class="header-title-main">Tennis Tracker</span>
        <span class="header-title-sub">IBERO León</span>
      </div>
    </div>
    <button class="btn-header" onclick="resetDay()">
      <i class="fa-solid fa-rotate-left"></i>Reiniciar día
    </button>
  </header>

  <!-- =================== HERO SECTION =================== -->
  <div class="hero-section">
    <div class="hero-stripes"></div>
    <div class="hero-content">
      <div class="hero-badge">IBERO León · Tenis</div>
      <h1 class="hero-quote">DOMINA<br><span>LA CANCHA</span></h1>
      <p class="hero-sub">Registra · Compite · Conquista el ranking</p>
    </div>
  </div>

  <!-- =================== PLAYERS =================== -->
  <div class="section" id="players-section">
    <div class="section-header">
      <div class="section-icon"><i class="fa-solid fa-users"></i></div>
      <span class="section-title">Jugadores registrados</span>
    </div>
    <div id="players-list"></div>
    <div class="add-player-row">
      <input class="add-player-input" id="new-player-input" type="text"
        placeholder="Nombre del nuevo jugador…" maxlength="30" />
      <button class="btn-primary" onclick="addPlayer()">
        <i class="fa-solid fa-user-plus"></i>Agregar
      </button>
    </div>
  </div>

  <!-- =================== SETS =================== -->
  <div class="section" style="margin-top:8px;">
    <div class="section-header">
      <div class="section-icon"><i class="fa-solid fa-trophy"></i></div>
      <span class="section-title">Sets del día</span>
    </div>
    <div id="sets-container"></div>
    <button class="btn-add-set" onclick="openPlayerSelectModal()">
      <i class="fa-solid fa-plus"></i>Agregar Set
    </button>
  </div>

  <!-- =================== RANKING =================== -->
  <div id="ranking-section" style="margin-top:8px;">
    <div class="section-header">
      <div class="section-icon"><i class="fa-solid fa-ranking-star"></i></div>
      <span class="section-title">Ranking del día</span>
    </div>
    <div class="ranking-card">
      <div id="ranking-container"></div>
    </div>
  </div>

  <div class="app-footer">
    © IBERO León <i class="fa-solid fa-circle"></i> Tennis Tracker
  </div>
  <div style="height:60px;"></div>

  <!-- =============================================
       JAVASCRIPT
  ============================================= -->
  <script>
    /* ===================================================
       STATE
    =================================================== */
    let state = {
      players: [],   // [{ id, name }]
      sets: []       // [{ id, closed, scores: { playerId: number } }]
    };

    /* ===================================================
       PERSISTENCE
    =================================================== */
    function saveState() {
      try {
        localStorage.setItem('tennis_tracker_v2', JSON.stringify(state));
      } catch (e) {
        console.error('Error al guardar en localStorage:', e);
      }
    }

    function loadState() {
      try {
        // Try new key first, fall back to old key
        const raw = localStorage.getItem('tennis_tracker_v2')
                 || localStorage.getItem('tennis_tracker_v1');
        if (raw) {
          state = JSON.parse(raw);
          return;
        }
      } catch (e) {
        console.error('Error al cargar localStorage:', e);
      }
      // Default state with 6 players
      state = {
        players: [
          { id: uid(), name: 'Jugador 1' },
          { id: uid(), name: 'Jugador 2' },
          { id: uid(), name: 'Jugador 3' },
          { id: uid(), name: 'Jugador 4' },
          { id: uid(), name: 'Jugador 5' },
          { id: uid(), name: 'Jugador 6' },
        ],
        sets: []
      };
      saveState();
    }

    /* ===================================================
       UTILITIES
    =================================================== */
    function uid() {
      return Math.random().toString(36).slice(2, 10);
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /** Returns up to 2 uppercase initials from a name */
    function initials(name) {
      const parts = name.trim().split(/\s+/);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return name.slice(0, 2).toUpperCase();
    }

    /* ===================================================
       PLAYERS
    =================================================== */
    function renderPlayers() {
      const list = document.getElementById('players-list');
      list.innerHTML = '';
      state.players.forEach(player => {
        const row = document.createElement('div');
        row.className = 'player-row';
        row.innerHTML = `
          <div class="player-avatar">${escHtml(initials(player.name))}</div>
          <input
            class="player-name-input"
            type="text"
            value="${escHtml(player.name)}"
            maxlength="30"
            placeholder="Nombre…"
            onchange="updatePlayerName('${player.id}', this.value)"
            onblur="updatePlayerName('${player.id}', this.value)"
          />
          <button class="btn-icon" onclick="removePlayer('${player.id}')" title="Eliminar jugador">
            <i class="fa-solid fa-xmark"></i>
          </button>
        `;
        list.appendChild(row);
      });
    }

    function addPlayer() {
      const input = document.getElementById('new-player-input');
      const name = input.value.trim();
      if (!name) {
        input.focus();
        input.style.borderColor = 'var(--ibero-red)';
        input.style.boxShadow = '0 0 0 3px rgba(190,10,41,0.18)';
        input.classList.add('shake');
        setTimeout(() => {
          input.style.borderColor = '';
          input.style.boxShadow = '';
          input.classList.remove('shake');
        }, 1200);
        return;
      }
      const player = { id: uid(), name };
      state.players.push(player);
      saveState();
      input.value = '';
      renderAll();
    }

    function updatePlayerName(id, val) {
      const name = val.trim();
      if (!name) { renderPlayers(); return; }
      const p = state.players.find(p => p.id === id);
      if (p) {
        p.name = name;
        saveState();
        renderRanking();
        renderSets();
      }
    }

    function removePlayer(id) {
      if (!confirm('¿Eliminar este jugador? Sus puntos en sets cerrados se mantendrán en el historial.')) return;
      state.players = state.players.filter(p => p.id !== id);
      state.sets.forEach(set => {
        if (!set.closed) delete set.scores[id];
      });
      saveState();
      renderAll();
    }

    /* ===================================================
       PLAYER SELECT MODAL
    =================================================== */
    function openPlayerSelectModal() {
      if (state.players.length === 0) {
        alert('Agrega al menos un jugador antes de crear un set.');
        return;
      }

      const listEl = document.getElementById('modal-player-list');
      listEl.innerHTML = state.players.map(p => `
        <div class="modal-player-item">
          <div class="modal-player-info">
            <div class="modal-player-avatar">${escHtml(initials(p.name))}</div>
            <span class="modal-player-name">${escHtml(p.name)}</span>
          </div>
          <label class="toggle" aria-label="Seleccionar ${escHtml(p.name)}">
            <input type="checkbox" class="player-select-toggle" data-player-id="${p.id}" checked />
            <span class="toggle-slider"></span>
          </label>
        </div>
      `).join('');

      const modal = document.getElementById('player-select-modal');

      // FIX (Paso 1): registrar el listener del overlay solo una vez,
      // evitando que se acumule en cada apertura del modal.
      if (!modal._listenerRegistered) {
        modal.addEventListener('click', function(e) {
          if (e.target === this) closePlayerModal();
        });
        modal._listenerRegistered = true;
      }

      modal.classList.remove('hidden');
    }

    function closePlayerModal() {
      const modal = document.getElementById('player-select-modal');
      modal.classList.add('hidden');
      document.body.style.overflow = '';
    }

    function toggleAllPlayers(checked) {
      document.querySelectorAll('.player-select-toggle').forEach(cb => {
        cb.checked = checked;
        // Trigger the :has() CSS selector re-evaluation
        cb.dispatchEvent(new Event('change'));
      });
    }

    function confirmCreateSet() {
      const selected = [...document.querySelectorAll('.player-select-toggle:checked')];
      if (selected.length === 0) {
        const listEl = document.getElementById('modal-player-list');
        listEl.classList.add('shake');
        setTimeout(() => listEl.classList.remove('shake'), 300);
        return;
      }

      const scores = {};
      selected.forEach(cb => { scores[cb.dataset.playerId] = 0; });

      const newSet = { id: uid(), closed: false, scores };
      state.sets.push(newSet);
      saveState();
      closePlayerModal();
      renderSets();
      renderRanking();

      setTimeout(() => {
        const el = document.getElementById('set-' + newSet.id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }

    /* ===================================================
       PROGRESS RING
    =================================================== */
    const RING_R = 22;
    const RING_CIRCUMFERENCE = 2 * Math.PI * RING_R; // ≈ 138.23
    const SCORE_TARGET = 10; // 10 pts = 100%

    function buildRingSVG(setId, pid, score) {
      const progress = Math.min(score / SCORE_TARGET, 1);
      const offset = RING_CIRCUMFERENCE * (1 - progress);
      return `
        <div class="ring-container">
          <svg class="progress-ring" width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">
            <circle class="ring-track" cx="28" cy="28" r="${RING_R}" />
            <circle
              class="ring-fill"
              cx="28" cy="28" r="${RING_R}"
              id="ring-${setId}-${pid}"
              style="stroke-dashoffset:${offset};"
            />
          </svg>
          <span class="ring-label" id="score-${setId}-${pid}">${score}</span>
        </div>
      `;
    }

    function updateProgressRing(setId, playerId, score) {
      const ring = document.getElementById(`ring-${setId}-${playerId}`);
      if (!ring) return;
      const progress = Math.min(score / SCORE_TARGET, 1);
      const offset = RING_CIRCUMFERENCE * (1 - progress);
      ring.style.strokeDashoffset = offset;

      const label = document.getElementById(`score-${setId}-${playerId}`);
      if (label) label.textContent = score;
    }

    /* ===================================================
       SETS
    =================================================== */
    function renderSets() {
      const container = document.getElementById('sets-container');
      container.innerHTML = '';

      if (state.sets.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🎾</div>
            <div class="empty-state-title">Sin sets aún</div>
            <p>Toca "Agregar Set" para registrar el primer set del día.</p>
          </div>`;
        return;
      }

      state.sets.forEach((set, idx) => {
        const card = document.createElement('div');
        card.className = 'set-card' + (set.closed ? ' closed' : '');
        card.id = 'set-' + set.id;

        // Build rows — only for players included in this set's scores
        const participantIds = Object.keys(set.scores);
        const rows = participantIds.map(pid => {
          const player = state.players.find(p => p.id === pid);
          const name = player
            ? escHtml(player.name)
            : '<em style="color:var(--text-muted)">Jugador eliminado</em>';
          const avatarText = player ? escHtml(initials(player.name)) : '?';
          const score = set.scores[pid] ?? 0;
          const disabledClass = set.closed ? ' disabled' : '';

          const ringSvg = buildRingSVG(set.id, pid, score);

          const stepper = set.closed
            ? `<div class="score-stepper disabled">${ringSvg}</div>`
            : `<div class="set-score-area">
                ${ringSvg}
                <div class="score-stepper">
                  <button class="btn-stepper btn-minus" onclick="changeScore('${set.id}','${pid}',-1)" aria-label="Restar punto">
                    <i class="fa-solid fa-minus"></i>
                  </button>
                  <button class="btn-stepper btn-plus" onclick="changeScore('${set.id}','${pid}',1)" aria-label="Sumar punto">
                    <i class="fa-solid fa-plus"></i>
                  </button>
                </div>
               </div>`;

          return `
            <div class="set-player-row">
              <div class="set-player-info">
                <div class="set-player-avatar">${avatarText}</div>
                <span class="set-player-name">${name}</span>
              </div>
              ${stepper}
            </div>
          `;
        }).join('');

        const footer = set.closed
          ? ''
          : `<div class="set-footer">
               <button class="btn-close-set" onclick="closeSet('${set.id}')">
                 <i class="fa-solid fa-circle-check"></i>Cerrar Set ${idx + 1}
               </button>
             </div>`;

        card.innerHTML = `
          <div class="set-header">
            <div class="set-title-wrap">
              <span class="set-number-badge">${idx + 1}</span>
              <span class="set-title">Set ${idx + 1}</span>
            </div>
            ${set.closed
              ? '<span class="set-badge-closed"><i class="fa-solid fa-lock" style="font-size:0.52rem;margin-right:4px;"></i>Cerrado</span>'
              : `<span style="font-size:0.68rem;color:var(--text-muted);font-weight:600;">${participantIds.length} jugador${participantIds.length !== 1 ? 'es' : ''}</span>`}
          </div>
          <div class="set-body">${rows}</div>
          ${footer}
        `;
        container.appendChild(card);
      });
    }

    /**
     * Increment or decrement a score.
     * Updates only the ring and label without full re-render.
     */
    function changeScore(setId, playerId, delta) {
      const set = state.sets.find(s => s.id === setId);
      if (!set || set.closed) return;
      const current = set.scores[playerId] ?? 0;
      const newVal = Math.max(0, current + delta);
      set.scores[playerId] = newVal;
      saveState();

      // Lightweight DOM update
      updateProgressRing(setId, playerId, newVal);

      renderRanking();
    }

    function closeSet(setId) {
      const set = state.sets.find(s => s.id === setId);
      if (!set) return;
      set.closed = true;
      saveState();
      renderSets();
      renderRanking();
    }

    /* ===================================================
       RANKING
    =================================================== */
    function computeRanking() {
      const map = {};
      state.players.forEach(p => {
        map[p.id] = { name: p.name, totalPts: 0, setsPlayed: 0 };
      });
      state.sets.forEach(set => {
        Object.entries(set.scores).forEach(([pid, pts]) => {
          if (!map[pid]) {
            const p = state.players.find(pl => pl.id === pid);
            map[pid] = { name: p ? p.name : 'Jugador eliminado', totalPts: 0, setsPlayed: 0 };
          }
          map[pid].totalPts += pts;
          if (pts > 0 || set.closed) map[pid].setsPlayed += 1;
        });
      });
      return Object.entries(map)
        .map(([id, data]) => ({ id, ...data }))
        .sort((a, b) => {
          if (b.totalPts !== a.totalPts) return b.totalPts - a.totalPts;
          return a.name.localeCompare(b.name);
        });
    }

    function renderRanking() {
      const container = document.getElementById('ranking-container');
      const ranking = computeRanking();

      if (ranking.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📊</div>
            <div class="empty-state-title">Sin datos aún</div>
            <p>Agrega jugadores y sets para ver el ranking.</p>
          </div>`;
        return;
      }

      const medalClass = (i) => i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
      const medalEmoji = (i) => i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}`;

      const rows = ranking.map((p, i) => `
        <tr class="rank-row" data-id="${p.id}">
          <td><span class="rank-pos ${medalClass(i)}">${medalEmoji(i)}</span></td>
          <td><span class="rank-name">${escHtml(p.name)}</span></td>
          <td><span class="rank-pts">${p.totalPts}</span></td>
          <td><span class="rank-sets">${p.setsPlayed}</span></td>
        </tr>
      `).join('');

      container.innerHTML = `
        <table class="ranking-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Jugador</th>
              <th>Puntos</th>
              <th>Sets</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;

      container.querySelectorAll('tbody tr').forEach(tr => {
        tr.classList.add('rank-updated');
        setTimeout(() => tr.classList.remove('rank-updated'), 550);
      });
    }

    /* ===================================================
       RESET
    =================================================== */
    function resetDay() {
      if (!confirm('¿Reiniciar el día? Se borrarán todos los sets y puntos. Los jugadores se mantendrán.')) return;
      state.sets = [];
      saveState();
      renderAll();
    }

    /* ===================================================
       RENDER ALL
    =================================================== */
    function renderAll() {
      renderPlayers();
      renderSets();
      renderRanking();
    }

    /* ===================================================
       KEYBOARD SHORTCUT: Enter to add player
    =================================================== */
    document.getElementById('new-player-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addPlayer();
    });

    /* ===================================================
       INIT
    =================================================== */
    loadState();
    renderAll();
  </script>
</body>
</html>
